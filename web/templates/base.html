<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fasting Bot{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0f0f0f', 800: '#1a1a2e', 700: '#16213e', 600: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .timer-font { font-variant-numeric: tabular-nums; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .pulse-slow { animation: pulse-slow 3s ease-in-out infinite; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen">
    <nav class="border-b border-gray-800 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="/dashboard" class="text-lg font-semibold">🕐 Fasting Bot</a>
            <div class="flex gap-4 text-sm">
                <a href="/dashboard/{{ user.telegram_id }}" class="text-gray-400 hover:text-white">Дашборд</a>
                <a href="/history/{{ user.telegram_id }}" class="text-gray-400 hover:text-white">История</a>
                <a href="/stats/{{ user.telegram_id }}" class="text-gray-400 hover:text-white">Статистика</a>
                {% if user and user.telegram_id == 52784970 %}
                <a href="/admin/" class="text-amber-400 hover:text-amber-300">Админ</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
